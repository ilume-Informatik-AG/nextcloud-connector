name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [nextcloud-connector-outbound, nextcloud-connector-inbound]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Extract versions from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"              # z.B. v8.9-1.0.0
          STRIPPED="${TAG#v}"                   # -> 8.9-1.0.0
          CAMUNDA_VERSION="${STRIPPED%%-*}"     # -> 8.9
          CONNECTOR_VERSION="${STRIPPED#*-}"    # -> 1.0.0
          echo "camunda_version=$CAMUNDA_VERSION" >> "$GITHUB_OUTPUT"
          echo "connector_version=$CONNECTOR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.connector_version }} -DgenerateBackupPoms=false

      - name: Set camunda majorminor property
        run: mvn -B versions:set-property -Dproperty=version.camunda.majorminor -DnewVersion=${{ steps.version.outputs.camunda_version }} -DgenerateBackupPoms=false

      - name: Build jars
        run: mvn -B -pl ${{ matrix.module }} -am clean package

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image registry
        id: registry
        run: echo "value=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        run: >
          mvn -B -pl ${{ matrix.module }} -am package -Pbuild-image
          -Dimage.registry=${{ steps.registry.outputs.value }}

      - name: Upload jars to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.module }}/target/*.jar